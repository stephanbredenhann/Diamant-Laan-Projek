# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.NET Core app to Azure Web App - Diamant-Laan-Projek

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: src/DiamantLaan.Web/package-lock.json

      - name: Install Angular dependencies
        working-directory: src/DiamantLaan.Web
        run: npm ci

      - name: Build Angular frontend
        working-directory: src/DiamantLaan.Web
        run: npm run build

      - name: Copy Angular build to API wwwroot
        shell: pwsh
        run: |
          $source = "src/DiamantLaan.Web/dist/diamant-laan.web"
          $destination = "src/DiamantLaan.Api/wwwroot"

          if (!(Test-Path $source)) {
              Write-Error "Angular build output not found at $source"
              exit 1
          }

          if (Test-Path $destination) {
              Remove-Item $destination -Recurse -Force
          }

          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          Copy-Item "$source\*" $destination -Recurse -Force

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build with dotnet
        run: dotnet build --configuration Release

      - name: dotnet publish
        run: dotnet publish -c Release -o "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      - name: Check Azure credentials are available
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZUREAPPSERVICE_CLIENTID_3BE6C70AEC249455B579B9C405EAD3B }}
          AZURE_TENANT_ID: ${{ secrets.AZUREAPPSERVICE_TENANTID_4A975DE4742710DAB3A017199DFB0FC }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_8023724E851247A09FE0172548ED32 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AZURE_CLIENT_ID)) {
            Write-Error "CLIENT ID IS EMPTY"
          } else {
            Write-Host "Client ID is present"
          }

          if ([string]::IsNullOrWhiteSpace($env:AZURE_TENANT_ID)) {
            Write-Error "TENANT ID IS EMPTY"
          } else {
            Write-Host "Tenant ID is present"
          }

          if ([string]::IsNullOrWhiteSpace($env:AZURE_SUBSCRIPTION_ID)) {
            Write-Error "SUBSCRIPTION ID IS EMPTY"
          } else {
            Write-Host "Subscription ID is present"
          }

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_3BE6C70AEC249455B579B9C405EAD3B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_4A975DE4742710DAB3A017199DFB0FC }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_8023724E851247A09FE0172548ED32 }}
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_3BE6C70AEC249455B579B9C405EAD3B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_4A975DE4742710DAB3A017199DFB0FC }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_8023724E851247A09FE0172548ED32 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Diamant-Laan-Projek'
